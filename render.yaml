services:
  - type: web
    name: ice-nice
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ice-nice-db
          property: connectionString

databases:
  - name: ice-nice-db
    databaseName: ice_nice
    user: ice_nice_user
    plan: free
